<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワードの変更</title>
    <style>
        /* 認証確認まで非表示 */
        body { display: none; background: #f0f4f8; font-family: sans-serif; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { font-size: 20px; color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #4A90E2; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        button:hover { background: #357ABD; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .rules { text-align: left; background: #f9f9f9; padding: 15px; border-radius: 10px; margin-top: 20px; border: 1px solid #eee; }
        .rules-title { font-size: 13px; font-weight: bold; color: #555; margin-bottom: 5px; }
        .rules-list { font-size: 12px; color: #666; margin: 0; padding-left: 20px; line-height: 1.6; }
        .back-link { display: block; margin-top: 25px; color: #999; text-decoration: none; font-size: 14px; transition: 0.2s; }
        .back-link:hover { color: #666; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>パスワードの設定</h1>
        <p style="font-size:14px; color:#666; line-height: 1.5;">
            セキュリティのため、今後使用する<br>あなた専用のパスワードを決めてください。
        </p>
        
        <input type="password" id="newPass" placeholder="新しいパスワード">
        <input type="password" id="confirmPass" placeholder="新しいパスワード（確認用）">
        
        <div class="rules">
            <div class="rules-title">パスワードのルール：</div>
            <ul class="rules-list">
                <li><strong>6文字以上</strong>で入力してください</li>
                <li>半角の<strong>英字（a〜z）や数字（0〜9）</strong>が使えます</li>
                <li>アルファベットの大文字・小文字は区別されます</li>
            </ul>
        </div>

        <button id="updateBtn">パスワードを更新する</button>

        <a href="mypage.html" class="back-link">← 変更せずに戻る（キャンセル）</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAuSr-KgBjfvp-yroLH2X0tujZaUenFVsY",
            authDomain: "boxwood-spot-486909-j1.firebaseapp.com",
            projectId: "boxwood-spot-486909-j1",
            storageBucket: "boxwood-spot-486909-j1.firebasestorage.app",
            messagingSenderId: "899371812603",
            appId: "1:899371812603:web:ced1901f7a3abb5e0e125e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const functions = getFunctions(app, "us-central1");

        // 安全な内部保持用変数
        let currentMemberId = "";

        // --- 門番（ログインチェック） ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.body.style.display = "flex";
                // ★修正点：ログインセッションから会員番号を直接特定
                currentMemberId = user.email.split('@')[0];
            } else {
                window.location.href = "index.html";
            }
        });

        document.getElementById("updateBtn").onclick = async () => {
            const btn = document.getElementById("updateBtn");
            const pass = document.getElementById("newPass").value.trim();
            const confirm = document.getElementById("confirmPass").value.trim();

            // ★修正点：localStorageではなく安全なセッション変数からチェック
            if (!currentMemberId) return alert("ログインからやり直してください。");
            if (pass.length < 6) return alert("パスワードは6文字以上で入力してください。");
            if (pass !== confirm) return alert("確認用パスワードが一致しません。");

            btn.disabled = true;
            btn.innerText = "更新中...";

            try {
                // ★最重要改善：確実に更新を通すため、現在のIDトークンを発行して直接手渡す
                const idToken = await auth.currentUser.getIdToken(true);
                const changePassword = httpsCallable(functions, 'changePassword');
                
                const res = await changePassword({ 
                    token: idToken,
                    newPassword: pass 
                });

                if (res.data.success) {
                    alert("パスワードの変更が完了しました！");
                    window.location.href = "mypage.html";
                } else {
                    alert("エラー: " + res.data.message);
                    btn.disabled = false;
                    btn.innerText = "パスワードを更新する";
                }
            } catch (e) { 
                console.error(e);
                alert("通信エラーが発生しました。時間を置いてもう一度お試しください。"); 
                btn.disabled = false;
                btn.innerText = "パスワードを更新する";
            }
        };
    </script>
</body>
</html>
