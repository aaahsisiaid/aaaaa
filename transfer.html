<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>振替授業への参加</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        .back-link { display: block; text-align: left; color: #4A90E2; text-decoration: none; font-size: 14px; margin-bottom: 20px; font-weight: bold; }
        h2 { color: #333; font-size: 20px; margin-bottom: 10px; }
        .guide-text { font-size: 13px; color: #666; margin-bottom: 25px; line-height: 1.5; background: #fff9e6; padding: 10px; border-radius: 10px; border: 1px solid #ffeeba; }
        .course-btn { width: 100%; padding: 18px 10px; color: white; border: none; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer; margin-bottom: 12px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; box-sizing: border-box; }
        .btn-blue { background: #5da0eb; box-shadow: 0 4px 0 #4a86c9; }
        .btn-green { background: #81c784; box-shadow: 0 4px 0 #66a569; }
        .btn-orange { background: #ffb74d; box-shadow: 0 4px 0 #e0a143; }
        #waitMessage { color: #d32f2f; font-weight: bold; font-size: 15px; margin-top: 20px; }
        .mode-label { font-size: 10px; color: #ff4d4d; margin-bottom: 5px; display: block; font-weight: bold; }
        .review-btn { display: none; align-items: center; justify-content: center; gap: 8px; margin-top: 5px; margin-bottom: 20px; font-size: 15px; color: #fff; background: #9c27b0; padding: 14px; border-radius: 12px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 0 #7b1fa2; transition: 0.3s; width: 100%; box-sizing: border-box; }
        .review-btn:hover { transform: translateY(2px); box-shadow: 0 2px 0 #7b1fa2; }
    </style>
</head>
<body>
    <div class="container">
        <a href="mypage.html" class="back-link">← 戻る</a>
        <h2>🔄 振替授業への参加</h2>
        <div class="guide-text">
            本日振替受講するクラスの授業ボタンをタップして参加してください。
        </div>
        <div id="courseList">読み込み中...</div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const isTestMode = false;
        const isReviewMode = false;
    
        const showReviewBtn = false;
     
        if (isReviewMode && !isTestMode) {
            alert("現在は復習期間のため、振替参加はできません。マイページに戻ります。");
            window.location.replace("mypage.html");
        }

        const firebaseConfig = {
            apiKey: "AIzaSyAuSr-KgBjfvp-yroLH2X0tujZaUenFVsY",
            authDomain: "boxwood-spot-486909-j1.firebaseapp.com",
            projectId: "boxwood-spot-486909-j1",
            storageBucket: "boxwood-spot-486909-j1.firebasestorage.app",
            messagingSenderId: "899371812603",
            appId: "1:899371812603:web:ced1901f7a3abb5e0e125e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const functions = getFunctions(app, "us-central1");

        let currentMemberId = "";

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentMemberId = user.email.split('@')[0];
                try {
                    const userDoc = await getDoc(doc(db, "users", currentMemberId));
                    if (userDoc.exists()) {
                        const userData = userDoc.data();
                        await loadTransferPage(userData.grade || "中1", userData.cNo || "");
                    } else {
                        document.getElementById("courseList").innerHTML = "ユーザーデータが見つかりません。";
                    }
                } catch (e) {
                    console.error(e);
                    document.getElementById("courseList").innerHTML = "データの読み込みに失敗しました。";
                }
            } else {
                window.location.href = "index.html";
            }
        });

        async function loadTransferPage(grade, classroomCd) {
            const reviewBtn = document.getElementById("reviewBtn");
            if (reviewBtn) {
                if (showReviewBtn) {
                    reviewBtn.style.display = "flex";
                    if (grade.includes("中1")) { reviewBtn.href = "j1.html"; }
                    else if (grade.includes("中2")) { reviewBtn.href = "j2.html"; }
                    else if (grade.includes("中3")) { reviewBtn.href = "j3.html"; }
                } else {
                    reviewBtn.style.display = "none";
                }
            }

            const cList = ["161", "162", "112", "170", "171", "172", "173", "174", "176", "177", "178", "119", "140", "150", "164", "113", "115", "120", "129", "130", "144", "146"];
            const jstNow = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Tokyo" }));
            const todayLabel = ["日", "月", "火", "水", "木", "金", "土"][jstNow.getDay()];
            const timeVal = jstNow.getHours() * 100 + jstNow.getMinutes();

            const courseListEl = document.getElementById("courseList");
         
            if (!isTestMode && (timeVal < 1850 || timeVal > 2200)) {
                courseListEl.innerHTML = `<p id="waitMessage">18:50以降に表示されます。</p>`;
                return;
            }

            try {
                const iDoc = await getDoc(doc(db, "masters", "course_info"));
                const courseMaster = iDoc.data() || {};
                const buttonList = [];

                // 学年キーの正規化（中3クラス等を中3に統一）
                const myGradeKey = grade.includes("中3") ? "中3" : (grade.includes("中2") ? "中2" : "中1");

                const isJ3Doc = myGradeKey === "中3" || grade.includes("中3");
               
                // 【変更箇所】中1・中2・中3すべての学年で「next_course_options_p2」を参照するように固定
                const targetDocName = "next_course_options_p3";

                let optionNames = [];
                try {
                    const nDoc = await getDoc(doc(db, "masters", targetDocName));
                    if (nDoc.exists()) {
                        const optionsData = nDoc.data() || {};
                        const options = optionsData[grade]?.[todayLabel] || optionsData[myGradeKey]?.[todayLabel] || {};
                       
                        Object.values(options).forEach(names => {
                            if (Array.isArray(names)) {
                                names.forEach(name => {
                                    if (!name) return;
                                   
                                    // 元の名前を100%残す
                                    optionNames.push(name);
                                   
                                    // 中3生用：すべての通常講座にクラス分け枝番号（①③ / ②④）のバリエーションを自動展開して網羅確率を最大化
                                    // （isJ3Docの判定を維持しているため、中3生のみ安全に実行されます）
                                    if (isJ3Doc && !name.includes("GMT")) {
                                        const hSet = cList.includes(classroomCd) ? ["①", "③"] : ["②", "④"];
                                        hSet.forEach(num => {
                                            let baseName = name.replace(/[①-④]/g, "");
                                                const match = baseName.match(/[ⅠⅡⅢⅣ]/);
                                                    if (match) {
                                                    const roman = match[0];
                                                    const core = baseName.replace(roman, "");
                                                    optionNames.push(`${core}${num}${roman}`);
                                                    optionNames.push(`${core}${roman}${num}`);
                                                } else {
                                                optionNames.push(`${baseName}${num}`);
                                            }
                                        });
                                    }
                                });
                            }
                        });
                    }
                } catch(err) { console.error("オプションマスター読み込みエラー:", err); }

                // 取得した講座名からボタン情報を生成（マイページ完全互換探索ロジック）
                optionNames.forEach(cId => {
                    if (!cId) return;
                    const cleanId = cId.trim();
                    const candidates = [
                        `${cleanId}_${grade}_${todayLabel}`,
                        `${grade}${cleanId}_${grade}_${todayLabel}`,
                        `${cleanId}_${myGradeKey}_${todayLabel}`,
                        `${myGradeKey}${cleanId}_${myGradeKey}_${todayLabel}`,
                        cleanId,
                        `${grade}${cleanId}`,
                        `${myGradeKey}${cleanId}`
                    ];
                 
                    let info = null;
                    let foundId = null;
                    for (const cand of candidates) {
                        if (courseMaster[cand]) { info = courseMaster[cand]; foundId = cand; break; }
                    }

                    if (info?.url) {
                        const timeMatch = info.name.match(/(\d{1,2}:\d{2})/);
                        buttonList.push({
                            cId: foundId || cleanId,
                            name: info.name,
                            url: info.url,
                            cls: info.type === "理科" ? "btn-green" : info.type === "社会" ? "btn-orange" : "btn-blue",
                            time: timeMatch ? timeMatch[0] : "99:99"
                        });
                    }
                });

                // 【最終防衛ライン：全自動強制救済抽出】
                if (buttonList.length === 0) {
                    Object.keys(courseMaster).forEach(key => {
                        const info = courseMaster[key];
                        if (info && info.url && info.name) {
                            const isToday = isTestMode || key.includes(`_${todayLabel}`) || info.name.includes(todayLabel) || key.includes("_全員");
                            const isMyGrade = key.includes(myGradeKey) || key.includes(grade) || info.name.includes(myGradeKey) || info.name.includes(grade);
                           
                            let isMyClass = true;
                            if (key.includes("①") || key.includes("③")) {
                                isMyClass = cList.includes(classroomCd);
                            } else if (key.includes("②") || key.includes("④")) {
                                isMyClass = !cList.includes(classroomCd);
                            }

                            if (isToday && isMyGrade && isMyClass) {
                                const timeMatch = info.name.match(/(\d{1,2}:\d{2})/);
                                buttonList.push({
                                    cId: key,
                                    name: info.name,
                                    url: info.url,
                                    cls: info.type === "理科" ? "btn-green" : info.type === "社会" ? "btn-orange" : "btn-blue",
                                    time: timeMatch ? timeMatch[0] : "99:99"
                                });
                            }
                        }
                    });
                }

                // GMT（全体共有枠）の追加
                const gmtCandidates = [`${myGradeKey}GMT`, `${grade}GMT`];
                gmtCandidates.forEach(gmtKey => {
                    if (courseMaster[gmtKey]?.url) {
                        const info = courseMaster[gmtKey];
                        const timeMatch = info.name.match(/(\d{1,2}:\d{2})/);
                        buttonList.push({
                            cId: gmtKey, name: info.name, url: info.url,
                            cls: "btn-blue", time: timeMatch ? timeMatch[0] : "99:99"
                        });
                    }
                });

                // 重複排除
                const seen = new Set();
                let unique = buttonList.filter(b => {
                    const key = `${b.cId}_${b.name}_${b.time}_${b.url}`;
                    return seen.has(key) ? false : seen.add(key);
                });

                // 【追加】中3生に中2の講座（地学・物理など）が表示されるのを防ぐフィルター
                if (myGradeKey === "中3") {
                    unique = unique.filter(b => !b.name.includes("中2") && !b.cId.includes("中2"));
                }

                unique.sort((a, b) => a.time.localeCompare(b.time));

                let btnHtml = isTestMode ? `<span class="mode-label">【テスト中】全表示モード</span>` : "";
                unique.forEach(b => {
                    btnHtml += `<a href="${b.url}" target="_blank" onclick="handleAttend('${b.cId}')" class="course-btn ${b.cls}"><i class="fas fa-video"></i> ${b.name}</a>`;
                });
                courseListEl.innerHTML = btnHtml || "本日の予定はありません。";
            } catch (e) {
                console.error(e);
                courseListEl.innerHTML = "エラーが発生したため、授業データを読み込めませんでした。";
            }
        }

        window.handleAttend = async (cId) => {
            try {
                const idToken = await auth.currentUser.getIdToken(true);
                await httpsCallable(functions, 'recordAttendance')({ token: idToken, courseId: cId + "_振替" });
            } catch (e) { console.error(e); }
        };

        if (!isReviewMode || isTestMode) {
            setInterval(() => window.location.reload(), 600000);
        }
    </script>
</body>
</html>
