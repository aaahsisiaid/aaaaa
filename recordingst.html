    {学年:"中3", 科目:"社会", 分野:"公民", 単元名:"市場経済と価格、金融", 難易度:"共通", URL:"https://zoom.us/rec/share/msOEgUN4pRXTEaV5cPjYXd3Y6-e68KQbgb_-79icTd8NU7zPONQnMElHAqAOrVs.RkeF32_U8XJI90Gk?startTime=1731325698000" },
    {学年:"中3", 科目:"社会", 分野:"公民", 単元名:"財政・国民の福祉と労働", 難易度:"共通", URL:"https://zoom.us/rec/share/DiH8S0lduoYTpYtOEsumSPERRYGssj7jGn66Y1lBK-ixrt9qSyZoyGk0s3o0ERA8.eIHzKjp3HveeNpj7?startTime=1731325643000" },
    {学年:"中3", 科目:"社会", 分野:"公民", 単元名:"環境・世界経済", 難易度:"共通", URL:"https://zoom.us/rec/share/ipQPdPnsaB1wgn8PhczlKTC4wU4pqRKMTTlXexJY-JdvLPQwSvqrONNBx1fZ7j8-.054M0X2hWvXyV-cY?startTime=1731325531000" },
    {学年:"中3", 科目:"社会", 分野:"公民", 単元名:"国際社会・国際問題", 難易度:"共通", URL:"https://zoom.us/rec/share/39zfr7hhcVWi5dcDu4xHQ3huZXs-fXUmpIwkHzhZjGL-YXCvtTtndkIS2Iy9UkzU.Ec21Ujmr53Kq0XzK?startTime=1731325620000" },
    ];

    const filters = { grade: 'all', subject: 'all', field: 'all', level: 'all' };
    const fieldsBySubject = { all: ["生物", "化学", "物理", "地学", "地理", "歴史", "公民"], 理科: ["生物", "化学", "物理", "地学"], 社会: ["地理", "歴史", "公民"] };

    window.setFilter = (type, value, el) => {
        filters[type] = value;
        const parent = el.parentElement;
        parent.querySelectorAll('.btn').forEach(b => b.classList.remove('active', 'active-accent'));
        if (type === 'grade') el.classList.add('active');
        else el.classList.add('active-accent');
        if (type === 'subject') { filters.field = 'all'; updateFieldButtons(value); }
        render();
    };

    function updateFieldButtons(subject) {
        const container = document.getElementById('fieldContainer');
        const list = fieldsBySubject[subject];
        container.innerHTML = '<span class="filter-label">分野:</span><button class="btn active-accent" onclick="setFilter(\'field\',\'all\',this)">すべて分野</button>';
        list.forEach(f => {
            const b = document.createElement('button');
            b.className = 'btn'; b.innerText = f;
            b.onclick = () => window.setFilter('field', f, b);
            container.appendChild(b);
        });
    }

    window.render = () => {
        const grid = document.getElementById('videoGrid');
        const query = document.getElementById('searchInput').value.toLowerCase();
        grid.innerHTML = '';

        const filtered = allVideos.filter(v => {
            const gradeList = v.学年.split(/[・,、]/).map(s => s.trim());
            const matchGrade = (filters.grade === 'all' || gradeList.includes(filters.grade));
            const matchSubject = (filters.subject === 'all' || v.科目 === filters.subject);
            // ★ 安全対策として v.分野 の存在チェック (v.分野 && ...) を追加しました
            const matchField = (filters.field === 'all' || (v.分野 && v.分野.startsWith(filters.field)));
            let matchLevel = (filters.level === 'all' || (filters.level === '共通' && v.難易度 === '共通') || (filters.level === '標準' && (v.難易度 === '標準' || v.難易度 === '共通')) || (filters.level === '発展' && (v.難易度 === '発展' || v.難易度 === '共通')));
            return matchGrade && matchSubject && matchField && matchLevel && v.単元名.toLowerCase().includes(query);
        });

        if (filtered.length === 0) { grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#999; margin-top:50px;">該当する動画がありません。</p>'; return; }

        filtered.forEach(v => {
            const a = document.createElement('a');
            a.className = `card field-${v.分野}`; a.href = v.URL; a.target = '_blank';
            
            // ★ 視聴ログ送信ロジック（目安時間をFirestoreへ）
            a.onclick = () => {
                const startTime = Date.now();
                const onFocus = async () => {
                    const durationSec = Math.round((Date.now() - startTime) / 1000);
                    if (durationSec > 10) { // 10秒以上の視聴で記録
                        try {
                            const idToken = await auth.currentUser.getIdToken(true);
                            await httpsCallable(functions, 'recordVideoLog')({
                                token: idToken,
                                type: "対策授業",
                                grade: v.学年,
                                subject: v.科目,
                                difficulty: v.難易度,
                                unitName: v.単元名,
                                durationSec: durationSec
                            });
                            console.log("対策授業 ログ保存完了");
                        } catch(e) { console.error("Log Error:", e); }
                    }
                    window.removeEventListener('focus', onFocus);
                };
                window.addEventListener('focus', onFocus);
            };

            a.innerHTML = `
                <div class="card-body">
                    <span class="grade-badge">${v.学年}</span>
                    <span style="font-size:0.7rem;font-weight:bold;color:#666;">${v.科目} | ${v.分野}</span>
                    <div class="unit-title">${v.単元名}</div>
                    <span class="level-tag level-${v.難易度}">${v.難易度}</span>
                </div>
                <div class="card-footer"><span>視聴を開始する</span><i class="fas fa-play-circle"></i></div>`;
            grid.appendChild(a);
        });
    };

    updateFieldButtons('all');
    window.render();
</script>
</body>
